<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>Hitoku Seller</title>

  <link rel="stylesheet" href="seller.css">

</head>

<body>

  <div class="top-bar">

    <h1>
      HITOKU SELLER 🍵
    </h1>

  </div>

  <div class="stats">

    <div class="stat-card">

      <h3>Order Masuk</h3>

      <p id="totalOrder">
        0
      </p>

    </div>

    <div class="stat-card">

      <h3>Selesai</h3>

      <p id="totalDone">
        0
      </p>

    </div>

    <div class="stat-card">

      <h3>Pendapatan</h3>

      <p id="totalRevenue">
        Rp 0
      </p>

    </div>

  </div>

  <div class="section-title">

    <h2>
      Order Masuk
    </h2>

  </div>

  <div id="orderList">

  </div>

  <div class="history-header">

    <h2>
      History Selesai
    </h2>

    <button onclick="clearHistory()">
      Clear History
    </button>

  </div>

  <div id="historyList">

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="seller.js"></script>

</body>

</html>
